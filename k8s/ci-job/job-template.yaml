apiVersion: batch/v1
kind: Job
metadata:
  name: __JOB_NAME__
  namespace: __CI_NAMESPACE__
  labels:
    app.kubernetes.io/name: ci-dispatch
    app.kubernetes.io/component: __STAGE_ID__
    ci.udap/commit: __COMMIT_SHA__
spec:
  backoffLimit: 0
  # The Job object is cleaned up automatically an hour after finishing; logs are
  # streamed back to the GitHub job before that, so nothing is lost.
  ttlSecondsAfterFinished: 3600
  activeDeadlineSeconds: __DEADLINE_SECONDS__
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ci-dispatch
        app.kubernetes.io/component: __STAGE_ID__
    spec:
      restartPolicy: Never
      serviceAccountName: github-runner
      terminationGracePeriodSeconds: 30
      containers:
        - name: ci
          # __RUNNER_IMAGE__ is a DIGEST reference (repo@sha256:...) that
          # dispatch.sh resolves from the runner-latest tag at submit time.
          #
          # IfNotPresent is only safe BECAUSE the reference is content-addressed.
          # With a mutable tag this combination silently pins every node to
          # whatever digest it happened to cache first: the ARC RunnerDeployment
          # uses imagePullPolicy: Always and so tracked the current image, while
          # dispatched Jobs on the same node kept booting a months-old one whose
          # toolchain predated the terraform install — "required command not
          # found: terraform" from an image that demonstrably had terraform.
          # Never replace this with a tag reference.
          image: __RUNNER_IMAGE__
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail
              echo "=== dispatched CI stage: ${STAGE_ID} ==="
              echo "pod: ${HOSTNAME}  node: ${NODE_NAME:-unknown}"
              echo "commit: ${COMMIT_SHA}"
              echo "user: $(id)"
              echo

              workdir="$(mktemp -d)"
              cd "${workdir}"

              echo "--- cloning ${GITHUB_SERVER}/${GITHUB_REPOSITORY} @ ${COMMIT_SHA} ---"
              git init -q .
              git remote add origin \
                "https://x-access-token:${GITHUB_TOKEN}@${GITHUB_SERVER_HOST}/${GITHUB_REPOSITORY}.git"
              git -c protocol.version=2 fetch -q --depth 1 origin "${COMMIT_SHA}"
              git checkout -q FETCH_HEAD
              echo "--- checkout complete ---"
              echo

              exec bash "${STAGE_COMMAND}"
          env:
            - name: STAGE_ID
              value: "__STAGE_ID__"
            - name: STAGE_COMMAND
              value: "__STAGE_COMMAND__"
            - name: COMMIT_SHA
              value: "__COMMIT_SHA__"
            - name: GITHUB_SHA
              value: "__COMMIT_SHA__"
            - name: GITHUB_REPOSITORY
              value: "__GITHUB_REPOSITORY__"
            - name: GITHUB_SERVER_HOST
              value: "github.com"
            - name: GITHUB_SERVER
              value: "https://github.com"
            # The dind sidecar publishes its socket into a DEDICATED shared
            # directory, never bare /var/run. The kubelet projects the
            # ServiceAccount token and the IRSA web-identity token under
            # /var/run/secrets, so mounting a volume at /var/run shadows both and
            # leaves aws/kubectl with no credentials in this container.
            # (/var/run is a symlink to /run on this image — same directory.)
            - name: DOCKER_HOST
              value: "unix:///var/run/docker/docker.sock"
            - name: AWS_REGION
              value: "__AWS_REGION__"
            - name: AWS_DEFAULT_REGION
              value: "__AWS_REGION__"
            - name: PROJECT_NAME
              valueFrom:
                secretKeyRef:
                  name: ci-dispatch-secrets
                  key: project_name
            - name: TF_STATE_BUCKET
              valueFrom:
                secretKeyRef:
                  name: ci-dispatch-secrets
                  key: tf_state_bucket
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ci-dispatch-secrets
                  key: github_token
            # STATIC AWS CREDENTIALS ARE REQUIRED — not a fallback for IRSA.
            #
            # Stages here run `terraform init` against the S3 state bucket. The
            # ServiceAccount's runner role deliberately has NO S3 access
            # (docs/DEPLOYMENT.md), AND its trust policy only admits
            # system:serviceaccount:actions-runner-system:github-runner, while
            # this Job runs in the ci-dispatch namespace — so
            # AssumeRoleWithWebIdentity is rejected outright and IRSA yields no
            # credentials whatsoever. Without these keys every stage that touches
            # terraform or ECR dies in the preamble, seconds after start.
            #
            # Static keys take precedence over IRSA in the AWS credential chain.
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: ci-dispatch-secrets
                  key: aws_access_key_id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: ci-dispatch-secrets
                  key: aws_secret_access_key
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              memory: "3Gi"
          volumeMounts:
            - name: docker-socket
              mountPath: /var/run/docker
            - name: workspace
              mountPath: /home/runner/work
        # Docker-in-Docker sidecar: the build stages build images in-cluster.
        # This container starts in PARALLEL with `ci` — there is no ordering
        # guarantee — so stages call wait_for_docker() before using docker.
        - name: dind
          image: docker:27-dind
          securityContext:
            privileged: true
          # dockerd defaults to /var/run/docker.sock; it is pointed at the shared
          # subdirectory so the socket lands where DOCKER_HOST expects it without
          # either container mounting over /var/run itself.
          #
          # --group is REQUIRED, not cosmetic. The `ci` container runs as the
          # non-root uid 1001 (`runner`). Without --group, dockerd creates the
          # socket root-owned with no group access and every docker command in
          # `ci` fails INSTANTLY with a permission error — the pod dies in
          # seconds, long before wait_for_docker's timeout. Handing dockerd the
          # runner's gid makes the socket srw-rw---- root:runner, which is
          # exactly how the ARC RunnerDeployment's own dind is wired (verified
          # live on a runner pod). Keep this in sync with the runner image's uid.
          command: ["dockerd"]
          args:
            - "--host=unix:///var/run/docker/docker.sock"
            - "--group=$(DOCKER_GROUP_GID)"
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
            - name: DOCKER_GROUP_GID
              value: "1001"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              memory: "2Gi"
          volumeMounts:
            - name: docker-socket
              mountPath: /var/run/docker
            - name: docker-storage
              mountPath: /var/lib/docker
      volumes:
        - name: docker-socket
          emptyDir: {}
        - name: docker-storage
          emptyDir: {}
        - name: workspace
          emptyDir: {}
