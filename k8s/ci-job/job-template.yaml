apiVersion: batch/v1
kind: Job
metadata:
  name: __JOB_NAME__
  namespace: __CI_NAMESPACE__
  labels:
    app.kubernetes.io/name: ci-dispatch
    app.kubernetes.io/component: __STAGE_ID__
    ci.udap/commit: __COMMIT_SHA__
spec:
  backoffLimit: 0
  # The Job object is cleaned up automatically an hour after finishing; logs are
  # streamed back to the GitHub job before that, so nothing is lost.
  ttlSecondsAfterFinished: 3600
  activeDeadlineSeconds: __DEADLINE_SECONDS__
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ci-dispatch
        app.kubernetes.io/component: __STAGE_ID__
    spec:
      restartPolicy: Never
      serviceAccountName: github-runner
      terminationGracePeriodSeconds: 30
      containers:
        - name: ci
          image: __RUNNER_IMAGE__
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail
              echo "=== dispatched CI stage: ${STAGE_ID} ==="
              echo "pod: ${HOSTNAME}  node: ${NODE_NAME:-unknown}"
              echo "commit: ${COMMIT_SHA}"
              echo

              workdir="$(mktemp -d)"
              cd "${workdir}"

              echo "--- cloning ${GITHUB_SERVER}/${GITHUB_REPOSITORY} @ ${COMMIT_SHA} ---"
              git init -q .
              git remote add origin \
                "https://x-access-token:${GITHUB_TOKEN}@${GITHUB_SERVER_HOST}/${GITHUB_REPOSITORY}.git"
              git -c protocol.version=2 fetch -q --depth 1 origin "${COMMIT_SHA}"
              git checkout -q FETCH_HEAD
              echo "--- checkout complete ---"
              echo

              exec bash "${STAGE_COMMAND}"
          env:
            - name: STAGE_ID
              value: "__STAGE_ID__"
            - name: STAGE_COMMAND
              value: "__STAGE_COMMAND__"
            - name: COMMIT_SHA
              value: "__COMMIT_SHA__"
            - name: GITHUB_SHA
              value: "__COMMIT_SHA__"
            - name: GITHUB_REPOSITORY
              value: "__GITHUB_REPOSITORY__"
            - name: GITHUB_SERVER_HOST
              value: "github.com"
            - name: GITHUB_SERVER
              value: "https://github.com"
            # The dind sidecar publishes its socket into the shared /var/run
            # volume. The runner image does NOT set DOCKER_HOST (ARC injects it
            # only on RunnerDeployment pods, which these dispatched Jobs are
            # not), so it is set explicitly here rather than relying on the
            # docker client's implicit default.
            - name: DOCKER_HOST
              value: "unix:///var/run/docker.sock"
            - name: AWS_REGION
              value: "__AWS_REGION__"
            - name: AWS_DEFAULT_REGION
              value: "__AWS_REGION__"
            - name: PROJECT_NAME
              valueFrom:
                secretKeyRef:
                  name: ci-dispatch-secrets
                  key: project_name
            - name: TF_STATE_BUCKET
              valueFrom:
                secretKeyRef:
                  name: ci-dispatch-secrets
                  key: tf_state_bucket
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ci-dispatch-secrets
                  key: github_token
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              memory: "3Gi"
          volumeMounts:
            - name: docker-socket
              mountPath: /var/run
            - name: workspace
              mountPath: /home/runner/work
        # Docker-in-Docker sidecar: the build stages build images in-cluster.
        # This container starts in PARALLEL with `ci` — there is no ordering
        # guarantee — so stages call wait_for_docker() before using docker.
        - name: dind
          image: docker:27-dind
          securityContext:
            privileged: true
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              memory: "2Gi"
          volumeMounts:
            - name: docker-socket
              mountPath: /var/run
            - name: docker-storage
              mountPath: /var/lib/docker
      volumes:
        - name: docker-socket
          emptyDir: {}
        - name: docker-storage
          emptyDir: {}
        - name: workspace
          emptyDir: {}
