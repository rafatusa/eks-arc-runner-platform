version: 1
name: eks-arc-runner-platform
vcs: github

rollback:
  strategy: manual

# WORKFLOW OWNERSHIP / RUNNER PLACEMENT
# -------------------------------------
# deploy + destroy run on GitHub-hosted runners BY DESIGN: they create the EKS
# cluster and the ARC runner pool, so they cannot depend on that pool existing.
#
# ci-build and ci-validate are DISPATCH SHIMS (restored). The UDAP spec has no
# runner-placement key — the renderer always emits `runs-on: ubuntu-latest` —
# so a stage here can never target `[self-hosted, eks]` directly. Instead each
# hosted job is a thin controller: scripts/ci/dispatch.sh submits a Kubernetes
# Job that runs the REAL stage in-cluster on the SAME runner toolchain image
# the ARC runners use, streams its logs back, and exits with the in-cluster
# exit code. The work runs in Kubernetes; the GitHub job is honestly a shim.
#
# NATIVE ALTERNATIVE: docs/self-hosted-workflows/ci-build.yml and
# ci-validate.yml are true `runs-on: [self-hosted, eks]` workflows. They must be
# hand-committed to .github/workflows/ (the platform refuses writes there). If
# you do that, REMOVE the matching pipeline from `pipelines:` below first —
# otherwise every write_pipeline re-renders an ubuntu-latest shim OVER the
# native file. The two mechanisms cannot own the same filename.
#
# TOOLCHAIN NOTE: the setup steps in the shim stages install what DISPATCH.SH
# itself needs on the hosted runner (terraform + kubectl; aws and python3 are
# preinstalled on ubuntu-latest). The build toolchain (JDK, gradle, docker,
# helm, k6) is NOT needed here — it lives in the in-cluster runner image.

stages:
  - id: lint
    kind: lint
    timeout_minutes: 20
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Static analysis (Checkstyle + PMD + SpotBugs)
        working-directory: app
        run: |
          chmod +x ./gradlew
          ./gradlew checkstyleMain pmdMain spotbugsMain --no-daemon

  - id: test
    kind: test
    needs: [lint]
    timeout_minutes: 25
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: JUnit tests and JaCoCo coverage
        working-directory: app
        run: |
          chmod +x ./gradlew
          ./gradlew test jacocoTestReport jacocoTestCoverageVerification --no-daemon

  - id: build
    kind: build
    needs: [test]
    timeout_minutes: 25
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Gradle bootJar
        working-directory: app
        run: |
          chmod +x ./gradlew
          ./gradlew bootJar --no-daemon

  - id: provision
    kind: provision
    needs: [build]
    timeout_minutes: 60
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_aws_region: us-east-1
    steps:
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Terraform init
        working-directory: infra
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
      - name: Terraform validate
        working-directory: infra
        run: terraform validate
      - name: Terraform apply
        working-directory: infra
        run: terraform apply -input=false -auto-approve

  - id: configure
    kind: configure
    needs: [provision]
    timeout_minutes: 60
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_aws_region: us-east-1
      GITHUB_PAT: ${{ secrets.RUNNER_GITHUB_PAT }}
      RUNNER_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.31.3
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: Terraform init
        working-directory: infra
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
      - name: Bootstrap cluster add-ons (Metrics Server, ALB Controller, Cluster Autoscaler)
        run: bash scripts/bootstrap-addons.sh
      - name: Install Actions Runner Controller and the ephemeral runner pool
        run: bash scripts/bootstrap-arc.sh
      - name: Build and push the application image to ECR
        run: bash scripts/build-and-push.sh
      - name: Deploy the application via Helm
        run: bash scripts/deploy-app.sh

  - id: verify
    kind: verify
    needs: [provision, configure]
    timeout_minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_aws_region: us-east-1
    steps:
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.31.3
      - name: Terraform init
        working-directory: infra
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
      - name: Verify the platform end to end
        run: bash scripts/verify-platform.sh

pipelines:
  # ---------------------------------------------------------------------------
  # CI BUILD — every stage dispatches into the cluster and runs on the runner
  # toolchain image. The hosted job only submits the Job and mirrors its exit
  # code.
  # ---------------------------------------------------------------------------
  - id: ci-build
    stages:
      - id: gradle_build
        kind: build
        timeout_minutes: 45
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
          DISPATCH_GITHUB_TOKEN: ${{ secrets.RUNNER_GITHUB_PAT }}
        steps:
          - name: Set up Terraform
            uses: hashicorp/setup-terraform@v3
            with:
              terraform_version: 1.9.8
          - name: Set up kubectl
            uses: azure/setup-kubectl@v4
            with:
              version: v1.31.3
          - name: Dispatch the Gradle build into the cluster
            run: bash scripts/ci/dispatch.sh gradle_build scripts/ci/stages/gradle-build.sh 2400

      - id: checkstyle
        kind: lint
        needs: [gradle_build]
        timeout_minutes: 30
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
          DISPATCH_GITHUB_TOKEN: ${{ secrets.RUNNER_GITHUB_PAT }}
        steps:
          - name: Set up Terraform
            uses: hashicorp/setup-terraform@v3
            with:
              terraform_version: 1.9.8
          - name: Set up kubectl
            uses: azure/setup-kubectl@v4
            with:
              version: v1.31.3
          - name: Dispatch Checkstyle into the cluster
            run: bash scripts/ci/dispatch.sh checkstyle scripts/ci/stages/checkstyle.sh 1800

      - id: pmd
        kind: lint
        needs: [checkstyle]
        timeout_minutes: 30
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
          DISPATCH_GITHUB_TOKEN: ${{ secrets.RUNNER_GITHUB_PAT }}
        steps:
          - name: Set up Terraform
            uses: hashicorp/setup-terraform@v3
            with:
              terraform_version: 1.9.8
          - name: Set up kubectl
            uses: azure/setup-kubectl@v4
            with:
              version: v1.31.3
          - name: Dispatch PMD into the cluster
            run: bash scripts/ci/dispatch.sh pmd scripts/ci/stages/pmd.sh 1800

      - id: spotbugs
        kind: lint
        needs: [pmd]
        timeout_minutes: 30
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
          DISPATCH_GITHUB_TOKEN: ${{ secrets.RUNNER_GITHUB_PAT }}
        steps:
          - name: Set up Terraform
            uses: hashicorp/setup-terraform@v3
            with:
              terraform_version: 1.9.8
          - name: Set up kubectl
            uses: azure/setup-kubectl@v4
            with:
              version: v1.31.3
          - name: Dispatch SpotBugs into the cluster
            run: bash scripts/ci/dispatch.sh spotbugs scripts/ci/stages/spotbugs.sh 1800

      - id: junit
        kind: test
        needs: [spotbugs]
        timeout_minutes: 35
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
          DISPATCH_GITHUB_TOKEN: ${{ secrets.RUNNER_GITHUB_PAT }}
        steps:
          - name: Set up Terraform
            uses: hashicorp/setup-terraform@v3
            with:
              terraform_version: 1.9.8
          - name: Set up kubectl
            uses: azure/setup-kubectl@v4
            with:
              version: v1.31.3
          - name: Dispatch the JUnit suite into the cluster
            run: bash scripts/ci/dispatch.sh junit scripts/ci/stages/junit.sh 2400

      - id: jacoco
        kind: test
        needs: [junit]
        timeout_minutes: 35
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
          DISPATCH_GITHUB_TOKEN: ${{ secrets.RUNNER_GITHUB_PAT }}
        steps:
          - name: Set up Terraform
            uses: hashicorp/setup-terraform@v3
            with:
              terraform_version: 1.9.8
          - name: Set up kubectl
            uses: azure/setup-kubectl@v4
            with:
              version: v1.31.3
          - name: Dispatch the JaCoCo coverage gate into the cluster
            run: bash scripts/ci/dispatch.sh jacoco scripts/ci/stages/jacoco.sh 2400

      - id: docker_build
        kind: build
        needs: [jacoco]
        timeout_minutes: 40
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
          DISPATCH_GITHUB_TOKEN: ${{ secrets.RUNNER_GITHUB_PAT }}
        steps:
          - name: Set up Terraform
            uses: hashicorp/setup-terraform@v3
            with:
              terraform_version: 1.9.8
          - name: Set up kubectl
            uses: azure/setup-kubectl@v4
            with:
              version: v1.31.3
          - name: Dispatch the Docker build into the cluster
            run: bash scripts/ci/dispatch.sh docker_build scripts/ci/docker-build.sh 2400

      - id: ecr_push
        kind: build_push
        needs: [docker_build]
        timeout_minutes: 40
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
          DISPATCH_GITHUB_TOKEN: ${{ secrets.RUNNER_GITHUB_PAT }}
        steps:
          - name: Set up Terraform
            uses: hashicorp/setup-terraform@v3
            with:
              terraform_version: 1.9.8
          - name: Set up kubectl
            uses: azure/setup-kubectl@v4
            with:
              version: v1.31.3
          # Each dispatched stage is its own in-cluster pod with its own dind
          # sidecar, so the docker_build image does not survive. ecr-push.sh
          # rebuilds from the same commit before pushing — deliberate.
          - name: Dispatch the ECR push into the cluster
            run: bash scripts/ci/dispatch.sh ecr_push scripts/ci/ecr-push.sh 2400

      - id: helm_upgrade
        kind: custom
        needs: [ecr_push]
        timeout_minutes: 40
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
          DISPATCH_GITHUB_TOKEN: ${{ secrets.RUNNER_GITHUB_PAT }}
        steps:
          - name: Set up Terraform
            uses: hashicorp/setup-terraform@v3
            with:
              terraform_version: 1.9.8
          - name: Set up kubectl
            uses: azure/setup-kubectl@v4
            with:
              version: v1.31.3
          - name: Dispatch the Helm upgrade into the cluster
            run: bash scripts/ci/dispatch.sh helm_upgrade scripts/ci/helm-upgrade.sh 2400

      - id: verify_rollout
        kind: verify
        needs: [helm_upgrade]
        timeout_minutes: 30
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
          DISPATCH_GITHUB_TOKEN: ${{ secrets.RUNNER_GITHUB_PAT }}
        steps:
          - name: Set up Terraform
            uses: hashicorp/setup-terraform@v3
            with:
              terraform_version: 1.9.8
          - name: Set up kubectl
            uses: azure/setup-kubectl@v4
            with:
              version: v1.31.3
          - name: Dispatch the rollout verification into the cluster
            run: bash scripts/ci/dispatch.sh verify_rollout scripts/ci/verify-rollout.sh 1800

  # ---------------------------------------------------------------------------
  # CI VALIDATE — post-deployment validation, also dispatched in-cluster.
  # Each stage resolves the application URL from the cluster itself
  # (scripts/ci/lib/resolve-url.sh) rather than threading it between jobs:
  # the URL embeds PROJECT_NAME, which is a secret, and GitHub silently drops
  # job outputs containing secret substrings.
  # ---------------------------------------------------------------------------
  - id: ci-validate
    stages:
      - id: smoke_test
        kind: verify
        timeout_minutes: 30
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
          DISPATCH_GITHUB_TOKEN: ${{ secrets.RUNNER_GITHUB_PAT }}
        steps:
          - name: Set up Terraform
            uses: hashicorp/setup-terraform@v3
            with:
              terraform_version: 1.9.8
          - name: Set up kubectl
            uses: azure/setup-kubectl@v4
            with:
              version: v1.31.3
          - name: Dispatch the smoke test into the cluster
            run: bash scripts/ci/dispatch.sh smoke_test scripts/ci/smoke-test.sh 1800

      - id: rest_assured
        kind: e2e
        needs: [smoke_test]
        timeout_minutes: 40
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
          DISPATCH_GITHUB_TOKEN: ${{ secrets.RUNNER_GITHUB_PAT }}
        steps:
          - name: Set up Terraform
            uses: hashicorp/setup-terraform@v3
            with:
              terraform_version: 1.9.8
          - name: Set up kubectl
            uses: azure/setup-kubectl@v4
            with:
              version: v1.31.3
          - name: Dispatch the REST Assured suite into the cluster
            run: bash scripts/ci/dispatch.sh rest_assured scripts/ci/rest-assured.sh 2400

      - id: k6_load
        kind: perf
        needs: [rest_assured]
        timeout_minutes: 40
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
          DISPATCH_GITHUB_TOKEN: ${{ secrets.RUNNER_GITHUB_PAT }}
        steps:
          - name: Set up Terraform
            uses: hashicorp/setup-terraform@v3
            with:
              terraform_version: 1.9.8
          - name: Set up kubectl
            uses: azure/setup-kubectl@v4
            with:
              version: v1.31.3
          - name: Dispatch the k6 load test into the cluster
            run: bash scripts/ci/dispatch.sh k6_load scripts/ci/k6-load.sh 2400

      - id: deployment_verification
        kind: verify
        needs: [k6_load]
        timeout_minutes: 30
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
          DISPATCH_GITHUB_TOKEN: ${{ secrets.RUNNER_GITHUB_PAT }}
        steps:
          - name: Set up Terraform
            uses: hashicorp/setup-terraform@v3
            with:
              terraform_version: 1.9.8
          - name: Set up kubectl
            uses: azure/setup-kubectl@v4
            with:
              version: v1.31.3
          - name: Dispatch the deployment verification into the cluster
            run: bash scripts/ci/dispatch.sh deployment_verification scripts/ci/deployment-verify.sh 1800

      - id: html_report
        kind: notify
        needs: [deployment_verification]
        timeout_minutes: 30
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
          DISPATCH_GITHUB_TOKEN: ${{ secrets.RUNNER_GITHUB_PAT }}
        steps:
          - name: Set up Terraform
            uses: hashicorp/setup-terraform@v3
            with:
              terraform_version: 1.9.8
          - name: Set up kubectl
            uses: azure/setup-kubectl@v4
            with:
              version: v1.31.3
          # generate-report.sh publishes the report into a ConfigMap before its
          # pod exits; fetch-report.sh pulls it back here so it can be uploaded
          # as a workflow artifact. This ConfigMap hand-off is the one thing the
          # native (per-pod) workflow cannot do — there, each job re-runs its
          # own checks instead.
          - name: Dispatch report generation into the cluster
            run: bash scripts/ci/dispatch.sh html_report scripts/ci/generate-report.sh 1800
          - name: Fetch the generated report
            run: bash scripts/ci/fetch-report.sh
          - name: Upload the HTML validation report
            uses: actions/upload-artifact@v4
            with:
              name: validation-report
              path: reports/
              if-no-files-found: warn
