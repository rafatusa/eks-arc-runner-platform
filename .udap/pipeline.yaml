version: 1
name: eks-arc-runner-platform
vcs: github

rollback:
  strategy: manual

# WORKFLOW OWNERSHIP / RUNNER PLACEMENT
# -------------------------------------
# deploy + destroy run on GitHub-hosted runners BY DESIGN: they create the EKS
# cluster and the ARC runner pool, so they cannot depend on that pool existing.
#
# PHASE 2 (current): ci-build and ci-validate are NO LONGER declared here.
# They now live as hand-committed workflows that run natively on the ARC
# runners via `runs-on: [self-hosted, eks]` — the literal requirement. The spec
# has no runner-placement key (the renderer always emits `runs-on:
# ubuntu-latest`), so leaving them in `pipelines:` would re-render
# ubuntu-latest dispatch shims OVER the native workflows on every write.
# Sources of truth: docs/self-hosted-workflows/ci-build.yml and ci-validate.yml.
# See docs/DEPLOYMENT.md "Phase 2".
#
# The dispatch mechanism (scripts/ci/dispatch.sh, k8s/ci-job/) is retained as a
# working fallback for running a stage in-cluster from a hosted runner.

stages:
  - id: lint
    kind: lint
    timeout_minutes: 20
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Static analysis (Checkstyle + PMD + SpotBugs)
        working-directory: app
        run: |
          chmod +x ./gradlew
          ./gradlew checkstyleMain pmdMain spotbugsMain --no-daemon

  - id: test
    kind: test
    needs: [lint]
    timeout_minutes: 25
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: JUnit tests and JaCoCo coverage
        working-directory: app
        run: |
          chmod +x ./gradlew
          ./gradlew test jacocoTestReport jacocoTestCoverageVerification --no-daemon

  - id: build
    kind: build
    needs: [test]
    timeout_minutes: 25
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Gradle bootJar
        working-directory: app
        run: |
          chmod +x ./gradlew
          ./gradlew bootJar --no-daemon

  - id: provision
    kind: provision
    needs: [build]
    timeout_minutes: 60
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_aws_region: us-east-1
    steps:
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Terraform init
        working-directory: infra
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
      - name: Terraform validate
        working-directory: infra
        run: terraform validate
      - name: Terraform apply
        working-directory: infra
        run: terraform apply -input=false -auto-approve

  - id: configure
    kind: configure
    needs: [provision]
    timeout_minutes: 60
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_aws_region: us-east-1
      GITHUB_PAT: ${{ secrets.RUNNER_GITHUB_PAT }}
      RUNNER_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.31.3
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: Terraform init
        working-directory: infra
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
      - name: Bootstrap cluster add-ons (Metrics Server, ALB Controller, Cluster Autoscaler)
        run: bash scripts/bootstrap-addons.sh
      - name: Install Actions Runner Controller and the ephemeral runner pool
        run: bash scripts/bootstrap-arc.sh
      - name: Build and push the application image to ECR
        run: bash scripts/build-and-push.sh
      - name: Deploy the application via Helm
        run: bash scripts/deploy-app.sh

  - id: verify
    kind: verify
    needs: [provision, configure]
    timeout_minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_aws_region: us-east-1
    steps:
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.31.3
      - name: Terraform init
        working-directory: infra
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
      - name: Verify the platform end to end
        run: bash scripts/verify-platform.sh
