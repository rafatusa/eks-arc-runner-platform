version: 1
name: eks-arc-runner-platform
vcs: github

rollback:
  strategy: manual

# WORKFLOW OWNERSHIP / RUNNER PLACEMENT
# -------------------------------------
# deploy + destroy run on GitHub-hosted runners BY DESIGN: they create the EKS
# cluster and the ARC runner pool, so they cannot depend on that pool existing.
# They are rendered from this spec and remain platform-owned.
#
# ci-build and ci-validate are NO LONGER RENDERED FROM THIS SPEC.
# ------------------------------------------------------------------
# They are now NATIVE self-hosted workflows that run directly on the ARC runner
# pool created by the configure stage:
#
#     runs-on: [self-hosted, linux, x64, eks]
#
# The UDAP spec has no runner-placement key — the renderer always emits
# `runs-on: ubuntu-latest` — so a stage declared HERE can never target the ARC
# pool. The previous design worked around that with a dispatch shim
# (scripts/ci/dispatch.sh submitted a Kubernetes Job and mirrored its exit
# code). That indirection is removed: the requirement is that GitHub Actions
# jobs execute ON the EKS runner pods, and only a native workflow does that.
#
# THE SOURCE FILES LIVE IN docs/self-hosted-workflows/ AND ARE HAND-COMMITTED
# TO .github/workflows/ BY A HUMAN — the platform refuses agent writes under
# .github/workflows/. Removing the two entries from `pipelines:` below is what
# makes that safe: while an entry exists here, every write_pipeline re-renders
# an ubuntu-latest shim OVER the native file. The two mechanisms cannot own the
# same filename.
#
# DO NOT re-add ci-build / ci-validate to `pipelines:` unless you are
# deliberately reverting to the hosted dispatch shim.

stages:
  - id: lint
    kind: lint
    timeout_minutes: 20
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Static analysis (Checkstyle + PMD + SpotBugs)
        working-directory: app
        run: |
          chmod +x ./gradlew
          ./gradlew checkstyleMain pmdMain spotbugsMain --no-daemon

  - id: test
    kind: test
    needs: [lint]
    timeout_minutes: 25
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: JUnit tests and JaCoCo coverage
        working-directory: app
        run: |
          chmod +x ./gradlew
          ./gradlew test jacocoTestReport jacocoTestCoverageVerification --no-daemon

  - id: build
    kind: build
    needs: [test]
    timeout_minutes: 25
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Gradle bootJar
        working-directory: app
        run: |
          chmod +x ./gradlew
          ./gradlew bootJar --no-daemon

  - id: provision
    kind: provision
    needs: [build]
    timeout_minutes: 60
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_aws_region: us-east-1
    steps:
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Terraform init
        working-directory: infra
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
      - name: Terraform validate
        working-directory: infra
        run: terraform validate
      - name: Terraform apply
        working-directory: infra
        run: terraform apply -input=false -auto-approve

  - id: configure
    kind: configure
    needs: [provision]
    timeout_minutes: 60
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_aws_region: us-east-1
      GITHUB_PAT: ${{ secrets.RUNNER_GITHUB_PAT }}
      RUNNER_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.31.3
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: Terraform init
        working-directory: infra
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
      - name: Bootstrap cluster add-ons (Metrics Server, ALB Controller, Cluster Autoscaler)
        run: bash scripts/bootstrap-addons.sh
      - name: Install Actions Runner Controller and the ephemeral runner pool
        run: bash scripts/bootstrap-arc.sh
      - name: Build and push the application image to ECR
        run: bash scripts/build-and-push.sh
      - name: Deploy the application via Helm
        run: bash scripts/deploy-app.sh

  - id: verify
    kind: verify
    needs: [provision, configure]
    timeout_minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_aws_region: us-east-1
    steps:
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.31.3
      - name: Terraform init
        working-directory: infra
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
      - name: Verify the platform end to end
        run: bash scripts/verify-platform.sh
