version: 1
name: eks-arc-runner-platform
vcs: github

rollback:
  strategy: manual

# WORKFLOW OWNERSHIP / RUNNER PLACEMENT
# -------------------------------------
# deploy + destroy run on GitHub-hosted runners BY DESIGN: they create the EKS
# cluster and the ARC runner pool, so they cannot depend on that pool existing.
#
# ci-build and ci-validate are the pipelines that must execute on the in-cluster
# runners. The spec has no runner-placement key (the renderer always emits
# `runs-on: ubuntu-latest`) and workflow files cannot be hand-authored, so each
# of their jobs is a THIN CONTROLLER: it submits a Kubernetes Job that runs the
# real stage inside the cluster on the same runner toolchain image the ARC
# runners use, streams the logs back, and exits with the in-cluster exit code.
# See scripts/ci/dispatch.sh. Ready-to-commit native `runs-on: [self-hosted, eks]`
# workflows are provided in docs/self-hosted-workflows/ for the switch-over.

stages:
  - id: lint
    kind: lint
    timeout_minutes: 20
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Static analysis (Checkstyle + PMD + SpotBugs)
        working-directory: app
        run: |
          chmod +x ./gradlew
          ./gradlew checkstyleMain pmdMain spotbugsMain --no-daemon

  - id: test
    kind: test
    needs: [lint]
    timeout_minutes: 25
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: JUnit tests and JaCoCo coverage
        working-directory: app
        run: |
          chmod +x ./gradlew
          ./gradlew test jacocoTestReport jacocoTestCoverageVerification --no-daemon

  - id: build
    kind: build
    needs: [test]
    timeout_minutes: 25
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Gradle bootJar
        working-directory: app
        run: |
          chmod +x ./gradlew
          ./gradlew bootJar --no-daemon

  - id: provision
    kind: provision
    needs: [build]
    timeout_minutes: 60
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_aws_region: us-east-1
    steps:
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Terraform init
        working-directory: infra
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
      - name: Terraform validate
        working-directory: infra
        run: terraform validate
      - name: Terraform apply
        working-directory: infra
        run: terraform apply -input=false -auto-approve

  - id: configure
    kind: configure
    needs: [provision]
    timeout_minutes: 60
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_aws_region: us-east-1
      GITHUB_PAT: ${{ secrets.RUNNER_GITHUB_PAT }}
      RUNNER_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.31.3
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: Terraform init
        working-directory: infra
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
      - name: Bootstrap cluster add-ons (Metrics Server, ALB Controller, Cluster Autoscaler)
        run: bash scripts/bootstrap-addons.sh
      - name: Install Actions Runner Controller and the ephemeral runner pool
        run: bash scripts/bootstrap-arc.sh
      - name: Build and push the application image to ECR
        run: bash scripts/build-and-push.sh
      - name: Deploy the application via Helm
        run: bash scripts/deploy-app.sh

  - id: verify
    kind: verify
    needs: [provision, configure]
    timeout_minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_aws_region: us-east-1
    steps:
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.31.3
      - name: Terraform init
        working-directory: infra
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
      - name: Verify the platform end to end
        run: bash scripts/verify-platform.sh

pipelines:
  # ---------------------------------------------------------------------------
  # BUILD PIPELINE — every stage's real work runs inside the EKS cluster.
  # ---------------------------------------------------------------------------
  - id: ci-build
    stages:
      - id: gradle_build
        kind: build
        timeout_minutes: 40
        env: &dispatch_env
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DISPATCH_GITHUB_TOKEN: ${{ secrets.RUNNER_GITHUB_PAT }}
        steps:
          - name: Set up Terraform
            uses: hashicorp/setup-terraform@v3
            with:
              terraform_version: 1.9.8
          - name: Set up kubectl
            uses: azure/setup-kubectl@v4
            with:
              version: v1.31.3
          - name: Gradle build (in-cluster)
            run: bash scripts/ci/dispatch.sh gradle_build scripts/ci/stages/gradle-build.sh 2100

      - id: checkstyle
        kind: lint
        needs: [gradle_build]
        timeout_minutes: 25
        env: *dispatch_env
        steps:
          - name: Set up Terraform
            uses: hashicorp/setup-terraform@v3
            with:
              terraform_version: 1.9.8
          - name: Set up kubectl
            uses: azure/setup-kubectl@v4
            with:
              version: v1.31.3
          - name: Checkstyle (in-cluster)
            run: bash scripts/ci/dispatch.sh checkstyle scripts/ci/stages/checkstyle.sh 1500

      - id: pmd
        kind: lint
        needs: [checkstyle]
        timeout_minutes: 25
        env: *dispatch_env
        steps:
          - name: Set up Terraform
            uses: hashicorp/setup-terraform@v3
            with:
              terraform_version: 1.9.8
          - name: Set up kubectl
            uses: azure/setup-kubectl@v4
            with:
              version: v1.31.3
          - name: PMD (in-cluster)
            run: bash scripts/ci/dispatch.sh pmd scripts/ci/stages/pmd.sh 1500

      - id: spotbugs
        kind: security
        needs: [pmd]
        timeout_minutes: 25
        env: *dispatch_env
        steps:
          - name: Set up Terraform
            uses: hashicorp/setup-terraform@v3
            with:
              terraform_version: 1.9.8
          - name: Set up kubectl
            uses: azure/setup-kubectl@v4
            with:
              version: v1.31.3
          - name: SpotBugs (in-cluster)
            run: bash scripts/ci/dispatch.sh spotbugs scripts/ci/stages/spotbugs.sh 1500

      - id: junit
        kind: test
        needs: [spotbugs]
        timeout_minutes: 30
        env: *dispatch_env
        steps:
          - name: Set up Terraform
            uses: hashicorp/setup-terraform@v3
            with:
              terraform_version: 1.9.8
          - name: Set up kubectl
            uses: azure/setup-kubectl@v4
            with:
              version: v1.31.3
          - name: JUnit tests (in-cluster)
            run: bash scripts/ci/dispatch.sh junit scripts/ci/stages/junit.sh 1800

      - id: jacoco
        kind: test
        needs: [junit]
        timeout_minutes: 30
        env: *dispatch_env
        steps:
          - name: Set up Terraform
            uses: hashicorp/setup-terraform@v3
            with:
              terraform_version: 1.9.8
          - name: Set up kubectl
            uses: azure/setup-kubectl@v4
            with:
              version: v1.31.3
          - name: JaCoCo coverage (in-cluster)
            run: bash scripts/ci/dispatch.sh jacoco scripts/ci/stages/jacoco.sh 1800

      - id: docker_build
        kind: build
        needs: [jacoco]
        timeout_minutes: 35
        env: *dispatch_env
        steps:
          - name: Set up Terraform
            uses: hashicorp/setup-terraform@v3
            with:
              terraform_version: 1.9.8
          - name: Set up kubectl
            uses: azure/setup-kubectl@v4
            with:
              version: v1.31.3
          - name: Build Docker image (in-cluster)
            run: bash scripts/ci/dispatch.sh docker_build scripts/ci/docker-build.sh 2100

      - id: ecr_push
        kind: build_push
        needs: [docker_build]
        timeout_minutes: 35
        env: *dispatch_env
        steps:
          - name: Set up Terraform
            uses: hashicorp/setup-terraform@v3
            with:
              terraform_version: 1.9.8
          - name: Set up kubectl
            uses: azure/setup-kubectl@v4
            with:
              version: v1.31.3
          - name: Push image to Amazon ECR (in-cluster)
            run: bash scripts/ci/dispatch.sh ecr_push scripts/ci/ecr-push.sh 2100

      - id: helm_upgrade
        kind: configure
        needs: [ecr_push]
        timeout_minutes: 30
        env: *dispatch_env
        steps:
          - name: Set up Terraform
            uses: hashicorp/setup-terraform@v3
            with:
              terraform_version: 1.9.8
          - name: Set up kubectl
            uses: azure/setup-kubectl@v4
            with:
              version: v1.31.3
          - name: Helm upgrade (in-cluster)
            run: bash scripts/ci/dispatch.sh helm_upgrade scripts/ci/helm-upgrade.sh 1800

      - id: rollout_verify
        kind: verify
        needs: [helm_upgrade]
        timeout_minutes: 25
        env: *dispatch_env
        steps:
          - name: Set up Terraform
            uses: hashicorp/setup-terraform@v3
            with:
              terraform_version: 1.9.8
          - name: Set up kubectl
            uses: azure/setup-kubectl@v4
            with:
              version: v1.31.3
          - name: Verify rollout (in-cluster)
            run: bash scripts/ci/dispatch.sh rollout_verify scripts/ci/verify-rollout.sh 1500

  # ---------------------------------------------------------------------------
  # VALIDATION PIPELINE — runs against the live deployment, from inside the cluster.
  # ---------------------------------------------------------------------------
  - id: ci-validate
    stages:
      - id: smoke_test
        kind: test
        timeout_minutes: 25
        env: *dispatch_env
        steps:
          - name: Set up Terraform
            uses: hashicorp/setup-terraform@v3
            with:
              terraform_version: 1.9.8
          - name: Set up kubectl
            uses: azure/setup-kubectl@v4
            with:
              version: v1.31.3
          - name: Smoke test (in-cluster)
            run: bash scripts/ci/dispatch.sh smoke_test scripts/ci/smoke-test.sh 1500

      - id: rest_assured
        kind: e2e
        needs: [smoke_test]
        timeout_minutes: 35
        env: *dispatch_env
        steps:
          - name: Set up Terraform
            uses: hashicorp/setup-terraform@v3
            with:
              terraform_version: 1.9.8
          - name: Set up kubectl
            uses: azure/setup-kubectl@v4
            with:
              version: v1.31.3
          - name: REST Assured tests (in-cluster)
            run: bash scripts/ci/dispatch.sh rest_assured scripts/ci/rest-assured.sh 2100

      - id: k6_load
        kind: perf
        needs: [rest_assured]
        timeout_minutes: 35
        env: *dispatch_env
        steps:
          - name: Set up Terraform
            uses: hashicorp/setup-terraform@v3
            with:
              terraform_version: 1.9.8
          - name: Set up kubectl
            uses: azure/setup-kubectl@v4
            with:
              version: v1.31.3
          - name: k6 load test (in-cluster)
            run: bash scripts/ci/dispatch.sh k6_load scripts/ci/k6-load.sh 2100

      - id: deployment_verification
        kind: verify
        needs: [k6_load]
        timeout_minutes: 25
        env: *dispatch_env
        steps:
          - name: Set up Terraform
            uses: hashicorp/setup-terraform@v3
            with:
              terraform_version: 1.9.8
          - name: Set up kubectl
            uses: azure/setup-kubectl@v4
            with:
              version: v1.31.3
          - name: Deployment verification (in-cluster)
            run: bash scripts/ci/dispatch.sh deployment_verification scripts/ci/deployment-verify.sh 1500

      - id: html_report
        kind: custom
        needs: [deployment_verification]
        timeout_minutes: 25
        env: *dispatch_env
        steps:
          - name: Set up Terraform
            uses: hashicorp/setup-terraform@v3
            with:
              terraform_version: 1.9.8
          - name: Set up kubectl
            uses: azure/setup-kubectl@v4
            with:
              version: v1.31.3
          - name: Generate HTML report (in-cluster)
            run: bash scripts/ci/dispatch.sh html_report scripts/ci/generate-report.sh 1500
          - name: Fetch the report from the cluster
            run: bash scripts/ci/fetch-report.sh
          - name: Upload the validation report
            uses: actions/upload-artifact@v4
            with:
              name: validation-report
              path: reports/
              if-no-files-found: error
