# PHASE 2 — NATIVE SELF-HOSTED VALIDATION PIPELINE
#
# Copy to .github/workflows/ci-validate.yml after the ARC runners are live.
# See docs/self-hosted-workflows/ci-build.yml for the full rationale.
#
# Unlike the dispatch version, these stages share nothing across jobs either —
# each job is its own ephemeral pod — so every stage resolves the application
# URL from the cluster itself (scripts/ci/lib/resolve-url.sh).
name: CI Validate (self-hosted)

on:
  workflow_run:
    workflows: ["CI Build (self-hosted)"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-validate-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_DEFAULT_REGION: us-east-1
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
  PROJECT_NAME: ${{ secrets.PROJECT_NAME }}

jobs:
  smoke_test:
    name: Smoke Test
    # Never validate a deployment the build pipeline failed to ship.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, eks]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Smoke test the public endpoints
        run: bash scripts/ci/smoke-test.sh

  rest_assured:
    name: REST Assured Tests
    runs-on: [self-hosted, eks]
    needs: [smoke_test]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run the REST Assured suite
        run: bash scripts/ci/rest-assured.sh
      - name: Upload REST Assured report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rest-assured-report
          path: reports/rest-assured/
          if-no-files-found: ignore

  k6_load:
    name: k6 Load Test
    runs-on: [self-hosted, eks]
    needs: [rest_assured]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run the k6 load test
        run: bash scripts/ci/k6-load.sh
      - name: Upload k6 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-results
          path: reports/
          if-no-files-found: ignore

  deployment_verification:
    name: Deployment Verification
    runs-on: [self-hosted, eks]
    needs: [k6_load]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify the deployed platform
        run: bash scripts/ci/deployment-verify.sh
      - name: Upload verification output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-verification
          path: reports/
          if-no-files-found: ignore

  html_report:
    name: Generate HTML Report
    runs-on: [self-hosted, eks]
    needs: [deployment_verification]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Generate the HTML validation report
        run: bash scripts/ci/generate-report.sh
      - name: Upload the HTML report
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: reports/
          if-no-files-found: error
